name: build binaries

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  linux-intel:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SC_R_PORTABLE_BASE_URL: https://github.com/dusadrian/binaries/releases/download/R_Portable
      SC_GITHUB_TOKEN: ${{ secrets.SC_R_PORTABLE_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Prepare bundled R runtime
        run: npm run prepare:r-portable

      - name: Build TypeScript output
        run: npm run build

      - name: Build Electron app (Linux intel)
        run: npx electron-builder --linux AppImage deb --x64 --publish never

      - name: Rename Linux artifacts
        run: npm run rename:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-intel-build
          path: |
            build/output/*.AppImage
            build/output/*.deb
          if-no-files-found: error

  windows-intel:
    runs-on: windows-latest
    environment: signing
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SC_R_PORTABLE_BASE_URL: https://github.com/dusadrian/binaries/releases/download/R_Portable
      SC_GITHUB_TOKEN: ${{ secrets.SC_R_PORTABLE_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Prepare bundled R runtime
        run: npm run prepare:r-portable

      - name: Build TypeScript output
        run: npm run build

      - name: Build Electron app (Windows intel)
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Rename Windows artifacts
        run: npm run rename:win

      - name: Azure login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_APPLICATION_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows artifacts
        uses: azure/artifact-signing-action@v1
        with:
          endpoint: https://plc.codesigning.azure.net/
          signing-account-name: dusadrian
          certificate-profile-name: electron-profile
          files-folder: ${{ github.workspace }}\build\output
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-intel-build
          path: |
            build/output/*.exe
            build/output/*.zip
          if-no-files-found: error

  macos-intel:
    runs-on: macos-15-intel
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      GH_TOKEN: ${{ secrets.SC_R_PORTABLE_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Verify macOS signing secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CSC_LINK:-}" ] || [ -z "${CSC_KEY_PASSWORD:-}" ]; then
            echo "::error::MAC_CSC_LINK and MAC_CSC_KEY_PASSWORD secrets are required for signed macOS builds."
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Prepare macOS bundled R runtime
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/darwin-x86.tar.gz"
          extract_dir="$RUNNER_TEMP/R_Portable_extract"
          mkdir -p "$extract_dir"
          gh release download R_Portable --repo dusadrian/binaries --pattern darwin-x86.tar.gz --dir "$RUNNER_TEMP" --clobber
          if unzip -tq "$archive" >/dev/null 2>&1; then
            unzip -q "$archive" -d "$extract_dir"
          else
            tar -xf "$archive" -C "$extract_dir"
          fi
          rm -rf R-runtime
          if [ -d "$extract_dir/darwin-x86" ]; then
            cp -R "$extract_dir/darwin-x86" R-runtime
          else
            mkdir -p R-runtime
            cp -R "$extract_dir"/. R-runtime
          fi

      - name: Build TypeScript output
        run: npm run build

      - name: Build Electron app (macOS intel, signed)
        run: npx electron-builder --mac dmg --x64 --publish never -c.mac.forceCodeSigning=true

      - name: Verify macOS code signature
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find build/output -path '*/StatConverter.app' -type d -print -quit)"
          if [ -z "$app_path" ]; then
            echo "::error::Could not find built StatConverter.app under build/output."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --display --verbose=2 "$app_path"

      - name: Rename macOS artifacts
        run: npm run rename:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-build
          path: build/output/*.dmg
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-22.04
    needs:
      - linux-intel
      - windows-intel
      - macos-intel

    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-intel-build
          path: release-assets/linux-intel

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-intel-build
          path: release-assets/windows-intel

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-intel-build
          path: release-assets/macos-intel

      - name: Resolve release metadata
        id: release
        run: |
          echo "tag=latest" >> "$GITHUB_OUTPUT"
          echo "name=Latest build" >> "$GITHUB_OUTPUT"

      - name: Publish assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.name }}
          generate_release_notes: false
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          overwrite_files: true
          append_body: false
          make_latest: false
          files: |
            release-assets/linux-intel/*
            release-assets/windows-intel/*
            release-assets/macos-intel/*
